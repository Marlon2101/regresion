<style>
  .navbar-custom {
    background: rgba(23, 32, 51, 0.85);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    margin: 20px auto;
    border-radius: 50px;
    width: 95%;
    max-width: 1200px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 15px rgba(215, 173, 67, 0.2);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 10px 25px;
    position: relative;
    z-index: 10;
  }

  .navbar-brand {
    color: #fff !important;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: linear-gradient(45deg, #ffffff, #d7ad43);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .navbar-brand i {
    color: #d7ad43;
    -webkit-text-fill-color: initial;
    margin-right: 10px;
    animation: pulseIcon 2s infinite;
  }

  @keyframes pulseIcon {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .navbar-custom .nav-link {
    color: #e0e0e0 !important;
    font-weight: 600;
    border-radius: 30px;
    padding: 8px 20px !important;
    margin: 0 5px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .navbar-custom .nav-link:hover,
  .navbar-custom .nav-link.active {
    background: linear-gradient(45deg, #d7ad43, #f3db7a);
    color: #111 !important;
  }
</style>

<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container">
    <a class="navbar-brand" href="/">
      <i class="fas fa-chart-line"></i> Regresión
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Portada</a></li>
        <li class="nav-item"><a class="nav-link" href="/regresion/lineal">Lineal</a></li>
        <li class="nav-item"><a class="nav-link" href="/regresion/cuadratica">Cuadrática</a></li>
        <li class="nav-item"><a class="nav-link" href="/regresion/exponencial">Exponencial</a></li>
      </ul>
    </div>
  </div>
</nav>

<script>
(function() {
  const contentSelector = '#page-content';
  const navLinkSelector = '.navbar-custom .nav-link';

  function updateActiveLink(pathname) {
    const links = document.querySelectorAll(navLinkSelector);
    links.forEach(link => {
      const href = new URL(link.href, window.location.origin).pathname;
      link.classList.toggle('active', href === pathname);
    });
  }

  function executeScripts(container) {
    const scripts = Array.from(container.querySelectorAll('script'));
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      if (oldScript.src) {
        newScript.src = oldScript.src;
      } else {
        newScript.textContent = oldScript.textContent;
      }
      document.head.appendChild(newScript);
      document.head.removeChild(newScript);
      oldScript.parentNode.removeChild(oldScript);
    });
  }

  async function loadPage(url, pushState = true) {
    try {
      const response = await fetch(url, { credentials: 'same-origin' });
      if (!response.ok) {
        window.location.href = url;
        return;
      }
      const text = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'text/html');
      const newContent = doc.querySelector(contentSelector);
      if (!newContent) {
        window.location.href = url;
        return;
      }
      const container = document.querySelector(contentSelector);
      container.innerHTML = newContent.innerHTML;
      executeScripts(container);
      document.title = doc.title || document.title;
      updateActiveLink(new URL(url, window.location.origin).pathname);
      if (pushState) {
        window.history.pushState({ url }, '', url);
      }
      if (typeof window.pageInit === 'function') {
        window.pageInit();
      }
    } catch (error) {
      console.error('Error loading page:', error);
      window.location.href = url;
    }
  }

  function onNavLinkClick(event) {
    const link = event.currentTarget;
    const url = link.href;
    if (link.target === '_blank' || event.metaKey || event.ctrlKey || event.shiftKey) {
      return;
    }
    const resolvedUrl = new URL(url, window.location.origin);
    if (resolvedUrl.origin !== window.location.origin) {
      return;
    }
    event.preventDefault();
    if (resolvedUrl.pathname === window.location.pathname) {
      return;
    }
    loadPage(resolvedUrl.pathname);
  }

  function bindNavLinks() {
    const links = document.querySelectorAll(navLinkSelector);
    links.forEach(link => {
      link.removeEventListener('click', onNavLinkClick);
      link.addEventListener('click', onNavLinkClick);
    });
  }

  function initNavigation() {
    bindNavLinks();
    updateActiveLink(window.location.pathname);
    window.addEventListener('popstate', event => {
      const url = (event.state && event.state.url) || window.location.pathname;
      loadPage(url, false);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initNavigation);
  } else {
    initNavigation();
  }
})();
</script>
